name: Deploy to Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Two deploys must never overlap on the same host.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    # GitHub-hosted: build and tests run off the production box.
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: verify
    # The runner is on the production VPS. It must only ever run workflows
    # triggered by pushes to main or by a maintainer (workflow_dispatch). Never
    # add a pull_request trigger to a job that runs here: in a public
    # repository that would execute a stranger's code on the server.
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    # --- BACKEND BUILD ---
    # Note: Relying on pre-installed .NET 8 on the VPS
    - name: Restore Backend
      run: dotnet restore backend/src/BalanceIO.API/BalanceIO.API.csproj

    - name: Publish Backend
      run: dotnet publish backend/src/BalanceIO.API/BalanceIO.API.csproj -c Release -o ./publish/api

    # --- FRONTEND BUILD ---
    # Note: Relying on pre-installed Node.js on the VPS
    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm ci

    - name: Build Frontend
      working-directory: frontend
      # `env:` rather than `set X=...` in the script: on a Windows runner the
      # default shell is PowerShell, where `set` is Set-Variable, so the old
      # line never reached npm and the bundle fell back to http://localhost:5210/api.
      env:
        NEXT_PUBLIC_API_URL: https://api.balanceio.id/api
      run: npm run build

    - name: Stage Frontend Output
      run: xcopy /E /I /Y frontend\out publish\client

    # --- DEPLOYMENT ---
    # NOTE: scripts/ is gitignored and checkout cleans ignored files, so this
    # path is empty after a fresh checkout unless the runner restores it.
    # Confirm where deploy.ps1 lives before relying on this step.
    - name: Execute Deployment Script
      run: powershell -ExecutionPolicy Bypass -File ./scripts/deploy.ps1 -SourcePath .
