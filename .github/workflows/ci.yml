name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the PostgreSQL migration and trigger tests.
      BALANCEIO_TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build backend/BalanceIO.sln -c Release --nologo
      - run: dotnet test backend/tests/BalanceIO.API.Tests -c Release --no-build --nologo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # next build writes next-env.d.ts (gitignored), which declares image
      # imports; tsc before it fails on any .png import.
      - run: npm run build
      - run: npx tsc --noEmit
      # The lint baseline is not clean (see docs/AUDIT-2026-10.md), so it is
      # reported but does not gate the build yet.
      - run: npm run lint
        continue-on-error: true
